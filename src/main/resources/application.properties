spring.application.name=autosusbcali
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicios_db}
spring.datasource.username=${DB_USERNAME:servicios_user}
spring.datasource.password=${DB_PASSWORD:servicios_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logs: nivel general INFO; el código del proyecto en DEBUG para ver más detalle
logging.level.root=INFO
logging.level.co.edu.usbcali.autosusbcali=DEBUG
